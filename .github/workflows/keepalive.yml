name: Keep free services awake

# Free Hugging Face Spaces sleep after ~48h without traffic and free Supabase projects pause after
# 7 days of inactivity. The API health check touches the database, so one ping keeps both alive.
on:
  schedule:
    - cron: "17 5 */2 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ping API and database
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then echo "Set the API_URL repository variable"; exit 1; fi
          for i in $(seq 1 12); do
            body=$(curl -fsS -m 30 "$API_URL/healthz" || true)
            if echo "$body" | grep -q '"database":true'; then echo "$body"; exit 0; fi
            echo "attempt $i: waiting for the Space to wake up"; sleep 30
          done
          echo "API did not become healthy"; exit 1

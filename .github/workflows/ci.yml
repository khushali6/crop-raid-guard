name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-and-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run SQL/RLS tests
        run: CONTAINER_NAME=crg-pg-ci PG_PORT=54329 bash supabase/tests/run_local.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: backend
        run: ruff check .
      - name: Tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54329/postgres
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: crop-raid-guard-ui
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Build (Vercel preset)
        run: NITRO_PRESET=vercel bun run build
      - run: bunx tsc --noEmit
      - run: bun run test
      - run: bun run lint

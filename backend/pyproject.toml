[project]
name = "crop-raid-guard-backend"
version = "0.1.0"
description = "Crop Raid Guard backend: vision pipeline, agents, RAG, evidence packs and MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.9",
  "google-genai>=1.20",
  "langgraph>=0.4",
  "mcp>=2.3",
  "httpx2>=2.10",
  "sqlglot>=25",
  "pypdf>=5",
  "cryptography>=43",
  "numpy>=1.26",
  "pillow>=10",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
vision = ["speciesnet>=5"]
rerank = ["sentence-transformers>=3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
